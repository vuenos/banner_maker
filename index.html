    <script>
      (function () {
        try {
          var theme = localStorage.getItem("banner-maker-theme");
          if (theme !== "dark" && theme !== "light") theme = "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var locale = localStorage.getItem("banner-maker-locale");
          if (
            locale !== "en" &&
            locale !== "ko" &&
            locale !== "ja" &&
            locale !== "es"
          ) {
            var primary =
              navigator.language ||
              (navigator.languages && navigator.languages[0]) ||
              "en";
            var code = String(primary).toLowerCase().split("-")[0];
            if (code === "ko") locale = "ko";
            else if (code === "ja") locale = "ja";
            else if (code === "es") locale = "es";
            else locale = "en";
          }
          document.documentElement.lang = locale;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.lang = "en";
        }
      })();
    </script>
